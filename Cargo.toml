[package]
name = "www-search"
version = "1.0.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.20", default-features = false, features = ["cookies", "blocking", "rustls-tls"] }
scraper = "0.23.1"
tokio = { version = "1.45.1", features = ["full"] }
url = "2.5.4"
urlencoding = "2.1.3"
rust-mcp-sdk = { version = "0.9.0", default-features = false, features = ["server", "macros", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
rust-mcp-transport = { version = "0.9.0", features = ["stdio"] }
rust-mcp-schema = "0.10.0"
